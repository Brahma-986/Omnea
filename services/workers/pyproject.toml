[project]
name = "workers"
version = "0.1.0"
description = "Temporal workers for background orchestration and sync"
requires-python = ">=3.11"
dependencies = [
    "procure-core",
    "procure-ingress",
    "procure-agents",
    "procure-context",
    "temporalio>=1.6.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workers"]
