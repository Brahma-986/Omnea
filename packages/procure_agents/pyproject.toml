[project]
name = "procure-agents"
version = "0.1.0"
description = "Pure domain agent workflows for procurement extraction, validation, and routing"
requires-python = ">=3.11"
dependencies = [
    "procure-core",
    "litellm>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procure_agents"]
