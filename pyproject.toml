[project]
name = "omnea-platform"
version = "0.1.0"
description = "AI-native procurement orchestration platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Omnea Engineering", email = "engineering@omnea.internal" }]
dependencies = [
    "procure-core",
    "procure-ingress",
    "procure-context",
    "procure-agents",
    "api",
    "workers",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.2",
    "pyotp>=2.12.0",
    "email-validator>=2.4.0",
    "pypdf>=7.1.1",
    "python-multipart>=0.0.34",
    "rapidfuzz>=3.14.6",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.uv.sources]
procure-core = { workspace = true }
procure-ingress = { workspace = true }
procure-context = { workspace = true }
procure-agents = { workspace = true }
api = { workspace = true }
workers = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "pre-commit>=3.7.1",
    "alembic>=1.13.1",
    "playwright>=1.65.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "ASYNC",# flake8-async
    "T20",  # flake8-print
]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"infra/alembic/*" = ["E402", "W291", "W293", "ARG001", "I001"]
"scripts/*" = ["T201", "W291", "W293", "F841", "E741", "ASYNC230", "ASYNC240", "C401", "C414", "B007"]
"services/workers/src/workers/cli.py" = ["T201"]
"tests/*" = ["ARG001", "ARG002", "B017", "B905", "T201", "W291", "W293", "F841", "ASYNC230", "ASYNC240"]
"examples/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["procure_core", "procure_ingress", "procure_context", "procure_agents", "api", "workers"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "neo4j.*",
    "temporalio.*",
    "aioboto3.*",
    "botocore.*",
    "litellm.*",
    "fastembed.*",
    "fastembed",
    "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "examples.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers -m \"not llm\" --timeout=30"
timeout = 30
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/eval"]
pythonpath = [
    "packages/procure_core/src",
    "packages/procure_ingress/src",
    "packages/procure_context/src",
    "packages/procure_agents/src",
    "services/api/src",
    "services/workers/src",
]
markers = [
    "unit: Pure unit tests without external services",
    "integration: Integration tests requiring backing services",
    "llm: Live LLM evaluation tests (requires live model API keys)",
    "real_embeddings: Tests using real 384-dim dense embeddings",
]
