[project]
name = "omnea-platform"
version = "0.1.0"
description = "AI-native procurement orchestration platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Omnea Engineering", email = "engineering@omnea.internal" }]
dependencies = [
    "procure-core",
    "procure-ingress",
    "procure-context",
    "procure-agents",
    "api",
    "workers",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.uv.sources]
procure-core = { workspace = true }
procure-ingress = { workspace = true }
procure-context = { workspace = true }
procure-agents = { workspace = true }
api = { workspace = true }
workers = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "pre-commit>=3.7.1",
    "alembic>=1.13.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "ASYNC",# flake8-async
    "T20",  # flake8-print
]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"infra/alembic/env.py" = ["E402"]
"services/workers/src/workers/cli.py" = ["T201"]
"tests/eval/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["procure_core", "procure_ingress", "procure_context", "procure_agents", "api", "workers"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "neo4j.*",
    "temporalio.*",
    "aioboto3.*",
    "botocore.*",
    "litellm",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers -m \"not llm\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
    "packages/procure_core/src",
    "packages/procure_ingress/src",
    "packages/procure_context/src",
    "packages/procure_agents/src",
    "services/api/src",
    "services/workers/src",
]
markers = [
    "unit: Pure unit tests without external services",
    "integration: Integration tests requiring backing services",
    "llm: Live LLM evaluation tests (requires live model API keys)",
    "real_embeddings: Tests using real 384-dim dense embeddings",
]
