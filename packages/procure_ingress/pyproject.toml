[project]
name = "procure-ingress"
version = "0.1.0"
description = "Omni-channel ingress engine, adapters, queue, and conversation sessions"
requires-python = ">=3.11"
dependencies = [
    "procure-core",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procure_ingress"]
