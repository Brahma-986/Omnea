name: CI & Security Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Static Quality & Type Safety
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Strict Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Run Mypy Strict Type Check
        run: uv run mypy packages services tests

  # ---------------------------------------------------------------------------
  # 2. Secret Leak Scan (Full Git History)
  # ---------------------------------------------------------------------------
  security-gitleaks:
    name: Gitleaks Secrets Scan (Full History)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERBOSE: true

  # ---------------------------------------------------------------------------
  # 3. Unit Test Suite & Spend Cap Hardening
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests & Budget Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run Unit Tests
        run: uv run pytest tests/unit -v --timeout=30

  # ---------------------------------------------------------------------------
  # 4. Golden Eval Gates & Negative-Regression Mutation Tests
  # ---------------------------------------------------------------------------
  eval-gates:
    name: Eval Gates (Golden Baselines & Mutations)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run TPRM Golden Evaluation
        run: uv run pytest tests/eval/test_tprm_golden_eval.py -v

      - name: Run Approval Golden Evaluation
        run: uv run pytest tests/eval/test_approval_golden_eval.py -v

      - name: Run TPRM Mutation Harness
        run: uv run pytest tests/unit/test_tprm_mutation_harness.py -v

  # ---------------------------------------------------------------------------
  # 5. OpenAPI Specification & SDK Sync Check
  # ---------------------------------------------------------------------------
  openapi-sdk-sync:
    name: OpenAPI Spec & SDK Regeneration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Verify OpenAPI Spec Validation
        run: |
          uv run pytest tests/unit/test_openapi_spec.py -v

      - name: Verify SDK Consistency
        run: |
          git status --porcelain sdk/
          test -z "$(git status --porcelain sdk/)"

  # ---------------------------------------------------------------------------
  # 6. Integration Test Suite with Live Services
  # ---------------------------------------------------------------------------
  integration:
    name: Integration Tests & RLS Matrix
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: procure_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/neo4j_password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p neo4j_password 'RETURN 1;'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run Alembic Database Migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: procure_os
        run: uv run alembic -c infra/alembic/alembic.ini upgrade head

      - name: Run Integration Tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: procure_os
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: neo4j_password
          TEMPORAL_TARGET_HOST: localhost:7233
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_BUCKET_ATTACHMENTS: procure-attachments
          SLACK_SIGNING_SECRET: test_slack_signing_secret
        run: uv run pytest tests/integration -v --timeout=60

  # ---------------------------------------------------------------------------
  # 7. Playwright End-to-End Browser Testing
  # ---------------------------------------------------------------------------
  playwright-e2e:
    name: Playwright E2E & Browser CSP Verification
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Install Playwright Browsers
        run: uv run playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: uv run pytest tests/e2e/test_swagger_playwright_csp.py tests/e2e/test_stage2_e2e_playwright.py -v --timeout=60

  # ---------------------------------------------------------------------------
  # 8. Container Build & Security Scan
  # ---------------------------------------------------------------------------
  container-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t omnea-platform:local .

      - name: Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "omnea-platform:local"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # ---------------------------------------------------------------------------
  # 9. Automated AI & Security Policy Code Review on PRs
  # ---------------------------------------------------------------------------
  ai-code-review:
    name: AI Architectural & Security Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Automated Security Checks on PR Diff
        run: |
          echo "Analyzing PR changes for security regressions..."
          # Check for forbidden unsafe-inline script in CSP
          if git diff origin/${{ github.base_ref }}...HEAD | grep -E "\+.*script-src.*'unsafe-inline'"; then
            echo "::error::Strict CSP violation detected: 'unsafe-inline' script-src is strictly forbidden."
            exit 1
          fi
          # Check for hardcoded private keys / tokens
          if git diff origin/${{ github.base_ref }}...HEAD | grep -E "\+.*(eyJh|xoxb-|omnea_live_)"; then
            echo "::error::Hardcoded credential token or private key detected in PR diff."
            exit 1
          fi
          echo "Automated AI Security Review Passed: Zero critical policy regressions."
