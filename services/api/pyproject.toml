[project]
name = "api"
version = "0.1.0"
description = "FastAPI service for the procurement platform"
requires-python = ">=3.11"
dependencies = [
    "procure-core",
    "procure-ingress",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
