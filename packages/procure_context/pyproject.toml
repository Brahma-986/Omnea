[project]
name = "procure-context"
version = "0.1.0"
description = "Enterprise context engine combining Neo4j graph & pgvector semantic store"
requires-python = ">=3.11"
dependencies = [
    "procure-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procure_context"]
